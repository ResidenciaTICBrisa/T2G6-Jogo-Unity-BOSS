name: Code Quality - Linter

on:
  push:
    branches: [main, dev, documentation]
  pull_request:
    branches: [main, dev]

jobs:
  super-linter:
    name: Lint Code Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@v5.0.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false

          # Linguagens para validar
          VALIDATE_CSHARP: true
          # VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true

          # Filtros para ignorar arquivos do Unity que não são código customizado
          FILTER_REGEX_EXCLUDE: ".*/(TextMesh Pro|Examples & Extras|Standard Assets)/.*"

          # Diretórios a ignorar
          IGNORE_GITIGNORED_FILES: true
